name: fleetwatch
description: FleetWatch app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.4.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.0
  provider: ^6.1.0
  image_picker: ^1.1.0
  file_picker: ^8.0.0
  pdf: ^3.1.1
  printing: ^5.0.0
  intl: ^0.19.0

  flutter_riverpod: ^2.6.1
  go_router: ^14.2.0
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.4.2
  http: ^1.2.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
