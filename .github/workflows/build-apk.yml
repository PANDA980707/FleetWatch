name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Create Android platform
        run: |
          flutter create . --platforms=android --project-name fleetwatch
          # Поднимаем Kotlin, если старая версия
          if [ -f android/build.gradle ]; then
            sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.24'/" android/build.gradle || true
          fi
          if [ -f android/settings.gradle ]; then
            sed -i "s/kotlin([^)]*) version \"[^\"]*\"/id \"org.jetbrains.kotlin.android\" version \"1.9.24\" apply false/" android/settings.gradle || true
          fi

      - name: Allow internet
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          grep -q "permission.INTERNET" android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release -v

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
