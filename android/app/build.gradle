plugins {
    id "com.android.application"
    id "kotlin-android"
}

android {
    namespace "com.panda.fleetwatch"
    compileSdk 33

    defaultConfig {
        applicationId "com.panda.fleetwatch"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.0"
}
